name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TikTokLiveTTS-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TikTokLiveTTS-demo-apk
          path: TikTokLiveTTS-demo.apk
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TikTokLiveTTS ${{ github.ref_name }}
          files: TikTokLiveTTS-demo.apk
